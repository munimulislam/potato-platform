{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Data explorer</h1>
</div>

<section id="explorer" class="card">
    <div class="card-content stack">
        <form id="filters" class="filters">
            <div class="field">
                <label for="f-env">Environment</label>
                <select id="f-env" name="env_type" class="input">
                    <option value="">All</option>
                </select>
            </div>
            <div class="field">
                <label for="f-year-from">Year from</label>
                <input id="f-year-from" name="year_from" class="input" type="number" inputmode="numeric">
            </div>
            <div class="field">
                <label for="f-year-to">Year to</label>
                <input id="f-year-to" name="year_to" class="input" type="number" inputmode="numeric">
            </div>
            <div class="field">
                <label for="f-location">Location</label>
                <input id="f-location" name="location" class="input" list="location-options" placeholder="Type or pick…"
                    autocomplete="off">
                <datalist id="location-options"></datalist>
            </div>
            <div class="field">
                <label for="f-variety">Variety contains</label>
                <input id="f-variety" name="variety" class="input" autocomplete="off">
            </div>
            <div class="field">
                <label for="f-experiment">Experiment contains</label>
                <input id="f-experiment" name="experiment" class="input" autocomplete="off">
            </div>
            <div class="field">
                <label for="f-trait">Trait</label>
                <select id="f-trait" name="trait" class="input">
                    <option value="">All traits</option>
                </select>
            </div>
            <div class="row">
                <button class="btn btn-sm" type="submit">Apply</button>
                <button id="reset" class="btn btn-outline btn-sm" type="button">Reset</button>
            </div>
        </form>

        <div class="row">
            <span id="summary" class="muted text-sm"></span>
            <span class="spacer"></span>
            <a id="download" class="btn btn-outline btn-sm" href="/api/explorer?format=csv">Download CSV</a>
        </div>
        <div id="table-body">
            <p class="muted">Loading…</p>
        </div>
        <div class="row">
            <button id="prev" class="btn btn-outline btn-sm" type="button">Previous</button>
            <span id="page-info" class="muted text-sm"></span>
            <button id="next" class="btn btn-outline btn-sm" type="button">Next</button>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='explorer.js') }}" defer></script>{% endblock %}
