[project]
name = "potato_pipeline"
version = "0.1.0"
description = "Pipeline that ingest, validate excel files and load them into data store and transform them for analysis & AI applications"
readme = "README.md"
authors = [
    { name = "Md Munimul Islam", email = "MdMunimul.Islam@teagasc.ie" }
]
requires-python = ">=3.12.10"
dependencies = [
    "dagster==1.13.25",
    "dagster-dlt==0.29.25",
    "dlt[postgres]==1.30.0",
    "pandas>=2.0",
    "dagster-dbt==0.29.25",
    "dbt-postgres==1.11.0",
    "dagster-postgres==0.29.25",
    "dagster-webserver==1.13.25",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.0,<2.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "dagster-dg-cli==1.13.25",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "potato_pipeline"
code_location_name = "potato_pipeline"
registry_modules = [
    "potato_pipeline.components.*",
]

[tool.uv.sources]
potato-core = { workspace = true }
