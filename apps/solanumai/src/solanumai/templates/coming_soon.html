{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px">
    <div class="card-header row">
        <h1>{{ model.display_name }}</h1><span class="spacer"></span><span class="badge">Coming soon</span>
    </div>
    <div class="card-content stack">
        <p class="muted">{{ model.description or "This model is being prepared and will be available here soon." }}</p>
        <div><a href="/" class="btn btn-outline">Back to models</a></div>
    </div>
</div>
{% endblock %}
