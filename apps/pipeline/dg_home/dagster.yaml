storage:
  postgres:
    postgres_db:
      hostname: { env: DB_HOST }
      port: { env: DB_PORT }
      db_name: { env: DB_NAME }
      username: { env: DAGSTER_USER }
      password: { env: DAGSTER_PASSWORD }

telemetry:
  enabled: false

concurrency:
  runs:
    max_concurrent_runs: 2
    tag_concurrency_limits:
      - key: "postgres"
        value: "trial"
        limit: 1

run_monitoring:
  enabled: true
  start_timeout_seconds: 180
  poll_interval_seconds: 60