[project]
name = "potato-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Md Munimul Islam", email = "MdMunimul.Islam@teagasc.ie" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/dbt"]

[tool.uv.sources]
potato-core = { workspace = true }
ml = { workspace = true }

[tool.dagster]
module_name = "potato_pipeline.definitions"
code_location_name = "potato_pipeline"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"