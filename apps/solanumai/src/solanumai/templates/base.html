<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
    <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>

<body>
    {% if user %}
    <header class="topbar">
        <div class="container topbar-inner">
            <a href="/" class="brand">{{ app_name }}</a>
            <nav class="nav">
                <a href="/" class="nav-link {{ 'active' if active == 'models' }}">Models</a>
                <a href="/explorer" class="nav-link {{ 'active' if active == 'explorer' }}">Data explorer</a>
                <a href="/chat" class="nav-link {{ 'active' if active == 'chat' }}">Ask the data</a>
            </nav>
            <div class="topbar-actions">
                <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle
                    aria-label="Toggle light or dark mode" title="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
                <span class="muted text-sm">{{ user.name }}</span>
                <a href="/logout" class="btn btn-outline btn-sm">Sign out</a>
            </div>
        </div>
    </header>
    {% endif %}
    <main class="{{ 'container main' if user }}">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>

</html>
