[project]
name = "potato-platform"
requires-python = "==3.12.10"
version = "0.1.0"
authors = [
    { name = "Md Munimul Islam", email = "MdMunimul.Islam@teagasc.ie" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.5"
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.dagster]
module_name = "potato_pipeline.definitions"
code_location_name = "potato_pipeline"

[tool.dg]
directory_type = "workspace"

[tool.dg.workspace]

[[tool.dg.workspace.projects]]
path = "apps/pipeline"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/dbt"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


