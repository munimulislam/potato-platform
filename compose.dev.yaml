services:
  postgres:
    ports:
      - 5433:5432

  pipeline-core:
    volumes:
      - ./packages:/app/packages
      - ./apps/pipeline:/app/apps/pipeline
      - ./apps/dbt:/app/apps/dbt

  pipeline-webserver:
    ports:
      - 3000:3000

  mlflow:
    ports: ["127.0.0.1:5000:5000"]

  solanumai:
    command: ["uvicorn", "solanumai.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/apps/solanumai/src", "--reload-dir", "/app/packages"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./apps/solanumai:/app/apps/solanumai
      - ./packages:/app/packages
  
  ollama:
    ports: ["127.0.0.1:11435:11434"] 